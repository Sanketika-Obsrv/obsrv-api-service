  financial:
    rule: '(?<![a-zA-Z0-9])credit(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])debit(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])account(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])transaction(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])txn(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])iban(?![a-zA-Z0-9])|(?<![a-zA-Z0-9])swift(?![a-zA-Z0-9])'
