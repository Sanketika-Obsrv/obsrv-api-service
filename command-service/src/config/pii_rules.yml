keys:
  # Boundary excludes letters only, not digits -- a trailing digit (name1, address1,
  # phone2) must not block a keyword match. For phone/internet/financial a miss here is
  # rescued by a value-pattern match; name/address have no value pattern at all, so a
  # digit-blocking boundary there is an unrescuable, silent false negative.
  address:
    rule: '(?<![a-zA-Z])address(?![a-zA-Z])|(?<![a-zA-Z])location(?![a-zA-Z])|(?<![a-zA-Z])addr(?![a-zA-Z])'
    locale: ''
    code: 'en'
    resourceKey: pii.descriptions.m001
  # Narrowed to compound forms that actually carry a credential-shaped value. The bare nouns
  # (account, transaction, credit, debit, swift) matched ordinary business fields with no PII
  # in them at all -- transaction_id, account_balance, credit_limit are identifiers/amounts,
  # not account numbers.
  financial:
    rule: '(?<![a-zA-Z])account[_-]?(number|no)(?![a-zA-Z])|(?<![a-zA-Z])card[_-]?number(?![a-zA-Z])|(?<![a-zA-Z])iban(?![a-zA-Z])|(?<![a-zA-Z])swift[_-]?code(?![a-zA-Z])'
    locale: ''
    code: 'en'
    resourceKey: pii.descriptions.m002
  internet:
    rule: '(?<![a-zA-Z])email(?![a-zA-Z])|(?<![a-zA-Z])ip(?![a-zA-Z])'
    locale: ''
    code: 'en'
    resourceKey: pii.descriptions.m004
  phone:
    rule: '(?<![a-zA-Z])phone(?![a-zA-Z])|(?<![a-zA-Z])mobile(?![a-zA-Z])|(?<![a-zA-Z])contact(?![a-zA-Z])'
    locale: ''
    code: 'en'
    resourceKey: pii.descriptions.m005
  # "name" alone has no value pattern to corroborate or veto it (see values.name below), so it
  # was flagging every *_name field in the platform's own metadata -- dataset_name, table_name,
  # job_name, file_name, event_name, column_name -- none of which are a person's name. Excluded
  # those specific platform-metadata compounds; a real person-name field like customer_name or
  # full_name still matches.
  name:
    rule: '(?<!dataset_)(?<!table_)(?<!job_)(?<!file_)(?<!event_)(?<!column_)(?<![a-zA-Z])name(?![a-zA-Z])'
    locale: ''
    code: 'en'
    resourceKey: pii.descriptions.m006
values:
  name: {}
  address:
    india:
      rule: '(?:\bAN\b|\bAP\b|\bAD\b|\bAR\b|\bAS\b|\bBH\b|\bCH\b|\bCT\b|\bDN\b|\bDL\b|\bGA\b|\bGJ\b|\bHR\b|\bHP\b|\bJK\b|\bJH\b|\bKA\b|\bKL\b|\bLD\b|\bMP\b|\bMH\b|\bMN\b|\bME\b|\bMI\b|\bNL\b|\bOR\b|\bPY\b|\bPB\b|\bRJ\b|\bSK\b|\bTN\b|\bTS\b|\bTR\b|\bUP\b|\bUT\b|\bWB\b)'
      locale: 'India'
      code: 'en'
      resourceKey: pii.descriptions.m007
    us: 
      rule: '\d{1,4} [\w\s]{1,20}(?:\bstreet\b|\bst\b|\bavenue\b|\bave\b|\broad\b|\brd\b|\bhighway\b|\bhwy\b|\bsquare\b|\bsq\b|\btrail\b|\btrl\b|\bdrive\b|\bdr\b|\bcourt\b|\bct\b|\bpark\b|\bparkway\b|\bpkwy\b|\bcircle\b|\bcir\b|\bboulevard\b|\bblvd\b)\W?(?=\s|$)'
      locale: 'USA'
      code: 'en'
      resourceKey: pii.descriptions.m008
  financial:
    credit_card:
      rule: '((?:(?:[0-9]{4}[- ]?){3}[0-9]{4}|[0-9]{15,16}))(?![0-9])'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m009
    iban_number: 
      rule: '[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7}([A-Z\d]?){0,16}'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m010
  id:
    aadhaar: 
      rule: '\b\d{4}[ -]\d{4}[ -]\d{4}'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m011
    pan: 
      rule: '\b[A-Z]{4}\d{4}[A-Z]'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m012
    ssn: 
      rule: '(?:\d{3}-\d{2}-\d{4})'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m013
  internet: 
    email:
      rule: '(?i)([A-Za-z0-9!#$%&*+\/=?^_{|.}~-]+@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m014
    ipv4: 
      rule: &IPv4 '(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m015
    ipv6: 
      rule: &IPv6 '\s*(?!.*::.*::)(?:(?!:)|:(?=:))(?:[0-9a-f]{0,4}(?:(?<=::)|(?<!::):)){6}(?:[0-9a-f]{0,4}(?:(?<=::)|(?<!::):)[0-9a-f]{0,4}(?:(?<=::)|(?<!:)|(?<=:)(?<!::):)|(?:25[0-4]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-4]|2[0-4]\d|1\d\d|[1-9]?\d)){3})\s*'
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m016
    ip_pattern: 
      rule: !join [*IPv4, '|' , *IPv6]
      locale: ''
      code: 'en'
      resourceKey: pii.descriptions.m017
  phone:
    india: 
      rule: \b(?:\+?91)?[6-9]\d{9}\b|\b(?:(?:\+91)|0)?\d{3,4}[ -]?\d{8}\b
      locale: 'India'
      code: 'en'
      resourceKey: pii.descriptions.m018
    france:
      rule: '\b(0?11)?330?[\d]{9}\b'
      locale: 'France'
      code: 'en'
      resourceKey: pii.descriptions.m018
    germany:
      rule: '\b[\d\w]\d{2}[\d\w]{6}\d[\d\w]\b'
      locale: 'Germany'
      code: 'en'
      resourceKey: pii.descriptions.m018
    uk:
      rule: '\b(0?11)?44[\d]{10,11}\b'
      locale: 'UK'
      code: 'en'
      resourceKey: pii.descriptions.m018
    us:
      rule: '\b((\+|\b)1[\-\. ])?\(?\b[\d]{3,5}([\-\. ]|\) ?)[\d]{3}[\-\. ][\d]{4}\b'
      locale: 'USA'
      code: 'en'
      resourceKey: pii.descriptions.m018
  